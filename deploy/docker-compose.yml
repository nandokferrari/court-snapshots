services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - snapshots:/snapshots
    env_file:
      - ../.env

  vsftpd:
    image: fauria/vsftpd
    restart: always
    entrypoint: ["/vsftpd-entrypoint.sh"]
    ports:
      - "21:21"
      - "30000-30100:30000-30100"
    volumes:
      - snapshots:/snapshots
      - ./vsftpd-entrypoint.sh:/vsftpd-entrypoint.sh
      - ./user_conf:/etc/vsftpd/user_conf
    environment:
      - FTP_USER=cam_mock
      - FTP_PASS=MockCourt2026x
      - PASV_ADDRESS=192.241.136.122
      - PASV_MIN_PORT=30000
      - PASV_MAX_PORT=30100

volumes:
  snapshots:
