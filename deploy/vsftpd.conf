background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

guest_enable=YES
virtual_use_local_privs=YES
pam_service_name=vsftpd_virtual
user_sub_token=$USER
local_root=/home/vsftpd/$USER

chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log
log_ftp_protocol=YES

port_enable=YES
connect_from_port_20=YES
ftp_data_port=20

pasv_enable=YES
pasv_address=192.241.136.122
pasv_min_port=30000
pasv_max_port=30100

seccomp_sandbox=NO

user_config_dir=/etc/vsftpd/user_conf
